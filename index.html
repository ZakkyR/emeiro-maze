<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>絵迷路メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
body{margin:0}
/* Layout: 左に操作パネル（方眼紙のノート風）、右に「問題」「解答」の2枚の紙を並べる作業台 */
:root{
  --bg:#eef1f3;
  --panel:#ffffff;
  --fg:#1c2329;
  --muted:#5d6872;
  --line:#d3dae0;
  --accent:#2f4fb5;
  --accent-soft:#e3e9fb;
  --paper:#ffffff;
  --paper-ink:#111111;
  --grid:rgba(47,79,181,.07);
  --warn:#a5461a;
  --f-display:"DotGothic16","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-num:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181d;--panel:#1c2228;--fg:#e4e9ee;--muted:#9aa6b1;--line:#2e363e;
  --accent:#8aa4ff;--accent-soft:#232c45;--paper:#f7f7f4;--paper-ink:#111111;
  --grid:rgba(138,164,255,.06);--warn:#f09a6b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181d;--panel:#1c2228;--fg:#e4e9ee;--muted:#9aa6b1;--line:#2e363e;
  --accent:#8aa4ff;--accent-soft:#232c45;--paper:#f7f7f4;--paper-ink:#111111;
  --grid:rgba(138,164,255,.06);--warn:#f09a6b;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;letter-spacing:.06em;margin:0;line-height:1.2}
header p{margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:18px}
@media (min-width:861px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto}}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field output{font-family:var(--f-num);font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],input[type=number],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{width:5.5em;font-family:var(--f-num)}
input[type=text]{flex:1}
input[type=color]{width:36px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--bg)}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button:focus-visible,.btn:focus-within,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.btn{position:relative;display:inline-block}
.check{display:flex;gap:6px;align-items:center}
.check input{accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:0}
#preview{width:100%;image-rendering:pixelated;border:1px solid var(--line);border-radius:6px;background:var(--paper)}

.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.status{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.status b{font-family:var(--f-num);font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.status .err{color:var(--warn);font-weight:700}
.sheets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.sheets{grid-template-columns:minmax(0,1fr)}}
.sheet{display:flex;flex-direction:column;gap:8px;min-width:0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sheet-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.08em}
.sheet-head .row{gap:6px}
.sheet-head button{padding:5px 10px;font-size:13px}
.paper{background:var(--paper);border-radius:4px;padding:18px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(20,30,40,.08);overflow:auto}
.paper svg{display:block;width:100%;height:auto}
.drop{outline:3px dashed var(--accent);outline-offset:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>絵迷路メーカー</h1>
    <p>正解ルートを塗ると絵が浮かぶ迷路を、画像や文字から作ります。</p>
  </header>

  <div class="layout">
    <aside class="panel" aria-label="設定">
      <div class="group">
        <h2>元にする絵</h2>
        <div class="row">
          <label class="btn">画像を選ぶ<input type="file" id="file" accept="image/*"></label>
          <span class="hint">ドロップ・貼り付けでもOK</span>
        </div>
        <div class="row">
          <input type="text" id="text" value="迷路" aria-label="文字">
          <button id="textBtn">文字で作る</button>
        </div>
        <canvas id="preview" aria-label="二値化した絵のプレビュー"></canvas>
        <p class="hint">黒が「塗られる部分」、青は離れた部分をつなぐために足した場所です。橙は一筆でつなげず塗らないことにした部分で、シードや入口・出口を変えると消えることがあります。</p>
      </div>

      <div class="group">
        <h2>絵の読み取り</h2>
        <div class="field"><div class="top"><label for="thr">しきい値</label><output id="thrOut"></output></div>
          <input type="range" id="thr" min="10" max="245" value="128"></div>
        <label class="check"><input type="checkbox" id="inv">白黒を反転する</label>
      </div>

      <div class="group">
        <h2>迷路の大きさ</h2>
        <div class="field"><div class="top"><label for="cols">横のマス数</label><output id="colsOut"></output></div>
          <input type="range" id="cols" min="24" max="240" step="2" value="64"></div>
        <div class="field"><div class="top"><label for="margin">絵のまわりの余白</label><output id="marginOut"></output></div>
          <input type="range" id="margin" min="1" max="10" value="2"></div>
      </div>

      <div class="group">
        <h2>迷路の性格</h2>
        <div class="field"><div class="top"><label for="branch">行き止まりの形</label><output id="branchOut"></output></div>
          <input type="range" id="branch" min="0" max="100" value="80"></div>
        <p class="hint">左ほど短い枝がたくさん、右ほど長く入り組みます。</p>
        <div class="row">
          <label for="start">入口</label>
          <select id="start"><option value="tl" selected>左上</option><option value="tr">右上</option><option value="bl">左下</option><option value="br">右下</option><option value="top">上（近い所）</option><option value="bottom">下（近い所）</option><option value="left">左（近い所）</option><option value="right">右（近い所）</option></select>
          <label for="goal">出口</label>
          <select id="goal"><option value="tl">左上</option><option value="tr">右上</option><option value="bl">左下</option><option value="br" selected>右下</option><option value="top">上（近い所）</option><option value="bottom">下（近い所）</option><option value="left">左（近い所）</option><option value="right">右（近い所）</option></select>
        </div>
        <div class="row">
          <label for="seed">シード</label>
          <input type="number" id="seed" value="1" min="0">
          <button id="reroll" class="primary">作り直す</button>
        </div>
      </div>

      <div class="group">
        <h2>SVG書き出し</h2>
        <div class="row">
          <label for="cellmm">1マス</label><input type="number" id="cellmm" value="3" min="0.5" step="0.1"><span class="hint">mm</span>
          <label for="linemm">線</label><input type="number" id="linemm" value="0.3" min="0.05" step="0.05"><span class="hint">mm</span>
        </div>
        <div class="row">
          <label for="fill">解答の塗り</label><input type="color" id="fill" value="#333333">
          <label class="check"><input type="checkbox" id="fadeAux" checked>つなぎ部分は薄く</label>
        </div>
        <label class="check"><input type="checkbox" id="routeLine">解答に経路の線も描く</label>
        <p class="hint" id="sizeHint"></p>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="status" id="status"></div>
      <div class="sheets">
        <section class="sheet">
          <div class="sheet-head">
            <h3>問題</h3>
            <div class="row">
              <button data-act="save" data-which="q">SVGを保存</button>
              <button data-act="copy" data-which="q">SVGをコピー</button>
            </div>
          </div>
          <div class="paper" id="qPaper"></div>
        </section>
        <section class="sheet">
          <div class="sheet-head">
            <h3>解答</h3>
            <div class="row">
              <button data-act="save" data-which="a">SVGを保存</button>
              <button data-act="copy" data-which="a">SVGをコピー</button>
            </div>
          </div>
          <div class="paper" id="aPaper"></div>
        </section>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// CORE START
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ink: Uint8Array(bw*bh) 1 = 塗る部分（2x2マスのブロック単位） */
function generateMaze(inkIn, bw, bh, opt){
  const rng = mulberry32(opt.seed>>>0);
  const nb = bw*bh;
  const ink = Uint8Array.from(inkIn);
  const bridge = new Uint8Array(nb);

  // 1) 連結成分を調べて、最大の成分に他をつなぐ
  const comp = new Int32Array(nb).fill(-1);
  const sizes = [];
  const q = new Int32Array(nb);
  for(let s=0;s<nb;s++){
    if(!ink[s]||comp[s]>=0) continue;
    const id=sizes.length; let h=0,t=0; q[t++]=s; comp[s]=id; let cnt=0;
    while(h<t){const c=q[h++];cnt++;const x=c%bw,y=(c/bw)|0;
      if(x>0&&ink[c-1]&&comp[c-1]<0){comp[c-1]=id;q[t++]=c-1;}
      if(x<bw-1&&ink[c+1]&&comp[c+1]<0){comp[c+1]=id;q[t++]=c+1;}
      if(y>0&&ink[c-bw]&&comp[c-bw]<0){comp[c-bw]=id;q[t++]=c-bw;}
      if(y<bh-1&&ink[c+bw]&&comp[c+bw]<0){comp[c+bw]=id;q[t++]=c+bw;}}
    sizes.push(cnt);
  }
  if(!sizes.length) throw new Error("塗る部分が見つかりません。しきい値か反転を調整してください。");
  let big=0; for(let i=1;i<sizes.length;i++) if(sizes[i]>sizes[big]) big=i;
  const inS=new Uint8Array(nb); const merged=new Uint8Array(sizes.length); merged[big]=1;
  for(let i=0;i<nb;i++) if(comp[i]===big) inS[i]=1;
  let remaining=sizes.length-1, bridges=0;
  const prev=new Int32Array(nb);
  while(remaining>0){
    prev.fill(-2); let h=0,t=0;
    for(let i=0;i<nb;i++) if(inS[i]){prev[i]=-1;q[t++]=i;}
    let hit=-1, from=-1;
    outer: while(h<t){const c=q[h++];const x=c%bw,y=(c/bw)|0;
      const ns=[]; if(x>0)ns.push(c-1); if(x<bw-1)ns.push(c+1); if(y>0)ns.push(c-bw); if(y<bh-1)ns.push(c+bw);
      for(const n of ns){ if(prev[n]!==-2) continue;
        if(ink[n]&&!inS[n]){hit=n;from=c;break outer;}
        if(!ink[n]){prev[n]=c;q[t++]=n;} }}
    if(hit<0) throw new Error("離れた部分をつなげませんでした。");
    let c=from; while(c>=0&&!inS[c]){ink[c]=1;bridge[c]=1;inS[c]=1;c=prev[c];}
    const id=comp[hit]; for(let i=0;i<nb;i++) if(comp[i]===id) inS[i]=1;
    merged[id]=1; remaining--; bridges++;
  }

  // 2) マス単位の準備（1ブロック = 2x2マス）
  const inkList=[]; for(let i=0;i<nb;i++) if(ink[i]) inkList.push(i);
  const W=bw*2, H=bh*2, N=W*H;
  const openR=new Uint8Array(N), openD=new Uint8Array(N), reg=new Uint8Array(N), kind=new Uint8Array(N);
  const cellsOf=b=>{const bx=b%bw,by=(b/bw)|0,TL=(2*by)*W+2*bx; return [TL,TL+1,TL+W+1,TL+W];}; // 時計回り
  for(const b of inkList) for(const c of cellsOf(b)){reg[c]=1;kind[c]=bridge[b]?2:1;}
  const blockOf=c=>((((c/W)|0)>>1)*bw+((c%W)>>1));
  const gridNbrs=(c)=>{const x=c%W,y=(c/W)|0,r=[]; if(x>0)r.push(c-1); if(x<W-1)r.push(c+1); if(y>0)r.push(c-W); if(y<H-1)r.push(c+W); return r;};
  const blkNbrs=b=>{const x=b%bw,y=(b/bw)|0,r=[]; if(x>0)r.push(b-1); if(x<bw-1)r.push(b+1); if(y>0)r.push(b-bw); if(y<bh-1)r.push(b+bw); return r;};
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(rng()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
  const corner={tl:0,tr:W-1,bl:(H-1)*W,br:N-1};
  const onSide=(c,side)=>{ if(side in corner) return c===corner[side];
    const x=c%W,y=(c/W)|0; return side==="top"?y===0:side==="bottom"?y===H-1:side==="left"?x===0:x===W-1;};
  // 角のときは、通路が入ってきた向きのまま外へ抜ける辺を開ける
  const openSideOf=(path,side)=>{ if(!(side in corner)) return side;
    const c=path[path.length-1], p=path.length>1?path[path.length-2]:-1;
    if(p>=0&&Math.abs(p-c)===W) return side[0]==="t"?"top":"bottom";
    return side[1]==="l"?"left":"right";};

  // 3) 入口側・出口側から背景マスを通る距離を測り、絵に入る場所と出る場所を決める
  const bq=new Int32Array(N);
  const freeDist=(side,blocked)=>{const dist=new Int32Array(N).fill(-1),par=new Int32Array(N).fill(-1);let h=0,t=0;
    for(let c=0;c<N;c++) if(onSide(c,side)&&!reg[c]&&!blocked[c]){dist[c]=0;bq[t++]=c;}
    while(h<t){const c=bq[h++]; for(const n of shuffle(gridNbrs(c))) if(dist[n]<0&&!reg[n]&&!blocked[n]){dist[n]=dist[c]+1;par[n]=c;bq[t++]=n;}}
    return {dist,par};};
  const trace=(co,par)=>{const p=[];let k=co;while(k>=0){p.push(k);k=par[k];}return p;}; // 絵の外側 → 外周
  const xyPar=c=>((c%W)+((c/W)|0))&1;
  const SD=freeDist(opt.start,new Uint8Array(N));
  // 絵に入るマスの候補（マスの色＝市松の偶奇ごとに一番近いもの）
  const sCands=[null,null]; { const bd=[1e9,1e9];
    for(let c=0;c<N;c++){ if(!reg[c]) continue; const pr=xyPar(c);
      for(const n of gridNbrs(c)) if(!reg[n]&&SD.dist[n]>=0&&(SD.dist[n]<bd[pr]||(SD.dist[n]===bd[pr]&&rng()<.3))){bd[pr]=SD.dist[n];sCands[pr]={c,n,d:SD.dist[n]};}} }
  const ctxs=[];
  for(const sE of sCands.filter(Boolean).sort((x,y)=>x.d-y.d)){
    const A=trace(sE.n,SD.par);
    const blk=new Uint8Array(N); for(const k of A) blk[k]=1;
    const GD=freeDist(opt.goal,blk);
    const goodOut=c=>{let best=-1; for(const n of gridNbrs(c)) if(!reg[n]&&!blk[n]&&GD.dist[n]>=0&&(best<0||GD.dist[n]<GD.dist[best])) best=n; return best;};
    const gBest=new Map();
    for(let c=0;c<N;c++){ if(!reg[c]) continue; const o=goodOut(c); if(o<0) continue;
      const b=blockOf(c); if(!gBest.has(b)||GD.dist[o]<gBest.get(b)) gBest.set(b,GD.dist[o]);}
    const gCands=[...gBest.entries()].sort((x,y)=>x[1]-y[1]).slice(0,6).map(e=>e[0]);
    if(gCands.length) ctxs.push({sE,A,GD,goodOut,gCands});
  }
  if(!ctxs.length) throw new Error("入口・出口までの通路を作れませんでした。余白を増やしてください。");
  const dirOf=(a,b)=> b===a+1?"right":b===a-1?"left":b===a+bw?"down":"up";
  const sideCells=(b,dir)=>{const [TL,TR,BR,BL]=cellsOf(b); return dir==="right"?[TR,BR]:dir==="left"?[TL,BL]:dir==="up"?[TL,TR]:[BL,BR];};
  const across=(c,dir)=> dir==="right"?c+1:dir==="left"?c-1:dir==="down"?c+W:c-W;
  const M=inkList.length*4;
  let result=null, best=null;

  // 4) 入口ブロックから出口ブロックへの「背骨」をランダムに選び、背骨以外は閉路にしてつなぎ込む
  const tStart=Date.now();
  for(let attempt=0;attempt<16&&!result;attempt++){
    if(best&&Date.now()-tStart>2500) break;
    const ctx=ctxs[attempt%ctxs.length]; const {sE,A,GD,goodOut,gCands}=ctx; const Sb=blockOf(sE.c);
    const Gb=gCands[((attempt/ctxs.length)|0)%gCands.length];
    let spine;
    if(Gb===Sb) spine=[Sb];
    else { // ループ消去ランダムウォーク
      const nxt=new Int32Array(nb).fill(-1); let cur=Gb, steps=0;
      while(cur!==Sb&&steps<800000){const ns=blkNbrs(cur).filter(n=>ink[n]); const n=ns[(rng()*ns.length)|0]; nxt[cur]=n; cur=n; steps++;}
      if(cur!==Sb) continue;
      spine=[]; cur=Gb; while(cur!==Sb){spine.push(cur);cur=nxt[cur];} spine.push(Sb); spine.reverse();
    }
    const inSpine=new Uint8Array(nb); for(const b of spine) inSpine[b]=1;

    // 背骨: 各ブロックの4マスを一筆で通り、次のブロックへ抜ける
    const order=[]; let a=sE.c, ok=true, gOut=-1;
    for(let i=0;i<spine.length;i++){
      const b=spine[i], cyc=cellsOf(b), k=cyc.indexOf(a);
      const cw=[cyc[k],cyc[(k+1)%4],cyc[(k+2)%4],cyc[(k+3)%4]], ccw=[cyc[k],cyc[(k+3)%4],cyc[(k+2)%4],cyc[(k+1)%4]];
      let seq;
      if(i<spine.length-1){const dir=dirOf(b,spine[i+1]); const sc=sideCells(b,dir);
        seq=sc.includes(cw[3])?cw:ccw; if(!sc.includes(seq[3])){ok=false;break;}
        a=across(seq[3],dir);
      } else {
        const o1=goodOut(cw[3]), o2=goodOut(ccw[3]);
        if(o1<0&&o2<0){ok=false;break;}
        if(o2<0||(o1>=0&&(GD.dist[o1]<GD.dist[o2]||(GD.dist[o1]===GD.dist[o2]&&rng()<.5)))){seq=cw;gOut=o1;} else {seq=ccw;gOut=o2;}
      }
      for(const c of seq) order.push(c);
    }
    if(!ok) continue;
    const nextC=new Int32Array(N).fill(-1), prevC=new Int32Array(N).fill(-1);
    for(let i=0;i+1<order.length;i++){nextC[order[i]]=order[i+1];prevC[order[i+1]]=order[i];}

    // 背骨以外: 成分ごとにランダムな全域木 → 外周をなぞる閉路
    const rest=inkList.filter(b=>!inSpine[b]); const inRest=new Uint8Array(nb); for(const b of rest) inRest[b]=1;
    const tR=new Uint8Array(nb), tD=new Uint8Array(nb), inT=new Uint8Array(nb);
    for(const st of shuffle(rest.slice())){ if(inT[st]) continue; inT[st]=1;
      const fr=[]; const pushE=x=>{for(const y of blkNbrs(x)) if(inRest[y]&&!inT[y]) fr.push(x,y);};
      pushE(st);
      while(fr.length){const k=((rng()*(fr.length/2))|0)*2; const x=fr[k],y=fr[k+1];
        fr[k]=fr[fr.length-2]; fr[k+1]=fr[fr.length-1]; fr.length-=2;
        if(inT[y]) continue; inT[y]=1;
        if(y===x+1)tR[x]=1; else if(x===y+1)tR[y]=1; else if(y===x+bw)tD[x]=1; else tD[y]=1;
        pushE(y);}}
    const lR=new Uint8Array(N), lD=new Uint8Array(N);
    for(const b of rest){const bx=b%bw,by=(b/bw)|0; const [TL,TR,BR,BL]=cellsOf(b);
      const up=by>0&&tD[b-bw], dn=tD[b], lf=bx>0&&tR[b-1], rt=tR[b];
      if(!up)lR[TL]=1; if(!dn)lR[BL]=1; if(!lf)lD[TL]=1; if(!rt)lD[TR]=1;
      if(rt){lR[TR]=1;lR[BR]=1;} if(dn){lD[BL]=1;lD[BR]=1;}}
    const lnb=c=>{const x=c%W,y=(c/W)|0,r=[];
      if(x<W-1&&lR[c])r.push(c+1); if(x>0&&lR[c-1])r.push(c-1); if(y<H-1&&lD[c])r.push(c+W); if(y>0&&lD[c-W])r.push(c-W); return r;};
    const loopId=new Int32Array(N).fill(-1), lnext=new Int32Array(N), lprev=new Int32Array(N); let nl=0;
    for(const b of rest) for(const c0 of cellsOf(b)){ if(loopId[c0]>=0) continue;
      let p=lnb(c0)[1], cur=c0;
      do{const ns=lnb(cur); const nx=ns[0]===p?ns[1]:ns[0]; loopId[cur]=nl; lnext[cur]=nx; lprev[nx]=cur; p=cur; cur=nx;}while(cur!==c0);
      nl++;}

    // 閉路を、隣り合う平行な辺のところで背骨の経路に差し込む
    const merged=new Uint8Array(nl); let remaining=nl, changed=true;
    while(changed&&remaining>0){changed=false;
      let p=order[0];
      while(p>=0){const q=nextC[p]; if(q<0) break;
        const offs=Math.abs(q-p)===1?[W,-W]:[1,-1];
        for(const o of shuffle(offs)){
          const u=p+o, v=q+o; if(u<0||v<0||u>=N||v>=N) continue;
          if(Math.abs(o)===1){const px=p%W; if(px+o<0||px+o>=W) continue;}
          const L=loopId[u]; if(L<0||merged[L]||loopId[v]!==L) continue;
          const walk=[];
          if(lnext[v]===u){let c=u; for(;;){walk.push(c); if(c===v)break; c=lnext[c];}}
          else if(lnext[u]===v){let c=u; for(;;){walk.push(c); if(c===v)break; c=lprev[c];}}
          else continue;
          let pn=p; for(const c of walk){nextC[pn]=c;prevC[c]=pn;pn=c;} nextC[pn]=q; prevC[q]=pn;
          merged[L]=1; remaining--; changed=true; break;}
        p=nextC[p];}}
    const path=[]; for(let c=order[0];c>=0;c=nextC[c]) path.push(c);
    const dropped=[]; if(remaining>0) for(let c=0;c<N;c++) if(loopId[c]>=0&&!merged[loopId[c]]) dropped.push(c);
    if(path.length+dropped.length!==M) continue;
    const cand={path,A,B:trace(gOut,GD.par),dropped};
    if(!dropped.length) result=cand; else if(!best||dropped.length<best.dropped.length) best=cand;
  }
  // 一筆でつなげない細い部分が残ったときは、そこを塗らない部分として扱う
  if(!result) result=best;
  if(!result) throw new Error("絵を一筆でなぞる経路を作れませんでした。シードや入口・出口を変えて試してください。");
  for(const c of result.dropped){reg[c]=0;kind[c]=4;}

  // 5) 入口通路 → 絵の一筆書き → 出口通路 を1本の正解ルートにする
  const A=result.A, B=result.B;
  const route=[]; for(let i=A.length-1;i>=0;i--) route.push(A[i]);
  for(const c of result.path) route.push(c);
  for(const k of B) route.push(k);
  const setOpen=(a,b,v)=>{ if(b===a+1)openR[a]=v; else if(a===b+1)openR[b]=v; else if(b===a+W)openD[a]=v; else openD[b]=v;};
  for(let i=0;i+1<route.length;i++) setOpen(route[i],route[i+1],1);
  const onPath=new Uint8Array(N); for(const k of route){onPath[k]=1; if(!kind[k])kind[k]=3;}
  const entry=route[0], exit=route[route.length-1];

  // 6) 残りのマスを行き止まりの枝で埋める（growing tree）
  const vis=Uint8Array.from(onPath); const list=new Int32Array(N); let len=0;
  const shuffled=route.slice(); for(let i=shuffled.length-1;i>0;i--){const j=(rng()*(i+1))|0;[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
  for(const k of shuffled) list[len++]=k;
  const p=opt.branch;
  while(len>0){const i=rng()<p?len-1:(rng()*len)|0; const c=list[i];
    const ns=gridNbrs(c).filter(n=>!vis[n]);
    if(!ns.length){list[i]=list[len-1];len--;continue;}
    const n=ns[(rng()*ns.length)|0]; setOpen(c,n,1); vis[n]=1; list[len++]=n;}

  return {W,H,openR,openD,kind,route,entry,exit,start:openSideOf(A,opt.start),goal:openSideOf(B,opt.goal),
    stats:{dropped:result.dropped.length,bridges,routeLen:route.length,cells:N}};
}

function buildSVG(m,o){
  const {W,H,openR,openD}=m, lw=o.line/o.cell, pad=lw;
  const isOpening=(c,side)=>(c===m.entry&&side===m.start)||(c===m.exit&&side===m.goal);
  let d="";
  for(let y=0;y<=H;y++){let run=-1;
    for(let x=0;x<=W;x++){let wall=false;
      if(x<W){ if(y===0) wall=!isOpening(x,"top"); else if(y===H) wall=!isOpening((H-1)*W+x,"bottom"); else wall=!openD[(y-1)*W+x]; }
      if(wall&&run<0) run=x; if(!wall&&run>=0){d+=`M${run} ${y}H${x}`;run=-1;}}}
  for(let x=0;x<=W;x++){let run=-1;
    for(let y=0;y<=H;y++){let wall=false;
      if(y<H){ if(x===0) wall=!isOpening(y*W,"left"); else if(x===W) wall=!isOpening(y*W+W-1,"right"); else wall=!openR[y*W+x-1]; }
      if(wall&&run<0) run=y; if(!wall&&run>=0){d+=`M${x} ${run}V${y}`;run=-1;}}}
  let fills="";
  if(o.answer){
    const paths={1:"",2:"",3:""};
    for(let y=0;y<H;y++){let x=0; while(x<W){const k=m.kind[y*W+x];
      if(k&&(k===1||m.route&&true)){ // 経路上のマスだけ塗る
        const onp=o.onPath[y*W+x]; if(!onp){x++;continue;}
        let x2=x+1; while(x2<W&&o.onPath[y*W+x2]&&m.kind[y*W+x2]===k) x2++;
        paths[k]+=`M${x} ${y}h${x2-x}v1h${x-x2}z`; x=x2; } else x++; }}
    const aux=o.fadeAux?' fill-opacity="0.35"':'';
    if(paths[1]) fills+=`<path d="${paths[1]}" fill="${o.fill}"/>`;
    if(paths[2]) fills+=`<path d="${paths[2]}" fill="${o.fill}"${aux}/>`;
    if(paths[3]) fills+=`<path d="${paths[3]}" fill="${o.fill}"${aux}/>`;
    if(o.routeLine){
      const pt=c=>`${(c%W)+.5} ${((c/W)|0)+.5}`;
      const out=(c,side)=>{const x=(c%W)+.5,y=((c/W)|0)+.5; return side==="top"?`${x} ${y-1}`:side==="bottom"?`${x} ${y+1}`:side==="left"?`${x-1} ${y}`:`${x+1} ${y}`;};
      let pl=out(m.entry,m.start)+" "+m.route.map(pt).join(" ")+" "+out(m.exit,m.goal);
      fills+=`<polyline points="${pl}" fill="none" stroke="#d6336c" stroke-width="${Math.max(lw*1.4,.15)}" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  }
  const vb=`${-pad-1} ${-pad-1} ${W+2*pad+2} ${H+2*pad+2}`;
  const wmm=((W+2*pad+2)*o.cell).toFixed(2), hmm=((H+2*pad+2)*o.cell).toFixed(2);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${wmm}mm" height="${hmm}mm" viewBox="${vb}">`+
    fills+`<path d="${d}" fill="none" stroke="#000" stroke-width="${lw}" stroke-linecap="square"/></svg>`;
}
// CORE END

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
let src=null, maze=null, lastInk=null, dl=null, timer=0;
const ids=["thr","inv","cols","margin","branch","start","goal","seed","cellmm","linemm","fill","fadeAux","routeLine"];

function readOpts(){return{thr:+$("thr").value,inv:$("inv").checked,cols:+$("cols").value,margin:+$("margin").value,
  branch:+$("branch").value/100,start:$("start").value,goal:$("goal").value,seed:Math.max(0,parseInt($("seed").value)||0),
  cell:Math.max(.1,parseFloat($("cellmm").value)||3),line:Math.max(.01,parseFloat($("linemm").value)||.3),
  fill:$("fill").value,fadeAux:$("fadeAux").checked,routeLine:$("routeLine").checked};}

function sampleInk(o){
  const bw=o.cols/2, iw=bw-2*o.margin; if(iw<3) throw new Error("余白が大きすぎます。横のマス数を増やすか余白を減らしてください。");
  const ih=Math.max(2,Math.round(iw*src.height/src.width)), bh=ih+2*o.margin;
  const S=4, c=document.createElement("canvas"); c.width=iw*S; c.height=ih*S;
  const x=c.getContext("2d",{willReadFrequently:true}); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high"; x.drawImage(src,0,0,c.width,c.height);
  const px=x.getImageData(0,0,c.width,c.height).data; const ink=new Uint8Array(bw*bh);
  for(let by=0;by<ih;by++)for(let bx=0;bx<iw;bx++){let s=0;
    for(let yy=0;yy<S;yy++)for(let xx=0;xx<S;xx++){const i=((by*S+yy)*c.width+bx*S+xx)*4; s+=.299*px[i]+.587*px[i+1]+.114*px[i+2];}
    let dark=s/(S*S)<o.thr; if(o.inv)dark=!dark; ink[(by+o.margin)*bw+bx+o.margin]=dark?1:0;}
  return {ink,bw,bh};
}

function drawPreview(m){
  const cv=$("preview"), sc=Math.max(1,Math.floor(560/m.W));
  cv.width=m.W*sc; cv.height=m.H*sc; const x=cv.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,cv.width,cv.height);
  const col={1:"#111",2:"#4a6bdc",3:"#9fb2ee",4:"#e8590c"};
  for(let i=0;i<m.W*m.H;i++){const k=m.kind[i]; if(!k)continue; x.fillStyle=col[k]; x.fillRect((i%m.W)*sc,((i/m.W)|0)*sc,sc,sc);}
}

function render(){
  const o=readOpts();
  $("thrOut").textContent=o.thr; $("colsOut").textContent=o.cols+" マス"; $("marginOut").textContent=o.margin*2+" マス";
  $("branchOut").textContent=Math.round(o.branch*100);
  if(!src) return;
  const st=$("status");
  try{
    const key=[o.thr,o.inv,o.cols,o.margin,o.branch,o.start,o.goal,o.seed].join();
    if(!maze||maze.key!==key||maze.src!==src){
      const {ink,bw,bh}=sampleInk(o);
      const t0=performance.now();
      const m=generateMaze(ink,bw,bh,{seed:o.seed,branch:o.branch,start:o.start,goal:o.goal});
      m.key=key; m.src=src; m.ms=performance.now()-t0;
      m.onPath=new Uint8Array(m.W*m.H); for(const k of m.route) m.onPath[k]=1;
      maze=m; drawPreview(m);
    }
    const m=maze, base={cell:o.cell,line:o.line,fill:o.fill,fadeAux:o.fadeAux,routeLine:o.routeLine,onPath:m.onPath};
    m.qSVG=buildSVG(m,{...base,answer:false}); m.aSVG=buildSVG(m,{...base,answer:true});
    $("qPaper").innerHTML=m.qSVG; $("aPaper").innerHTML=m.aSVG;
    const wmm=((m.W+2+2*o.line/o.cell)*o.cell), hmm=((m.H+2+2*o.line/o.cell)*o.cell);
    $("sizeHint").textContent=`仕上がり ${wmm.toFixed(0)} × ${hmm.toFixed(0)} mm（A5本文は約 120 × 180 mm、B5は約 150 × 220 mm）`;
    st.innerHTML=`<span>大きさ <b>${m.W} × ${m.H}</b> マス</span><span>正解ルート <b>${m.stats.routeLen}</b> マス</span>`+
      `<span>つないだ箇所 <b>${m.stats.bridges}</b></span>`+(m.stats.dropped?`<span class="err">一筆でつなげず塗らない部分 ${m.stats.dropped} マス（プレビューの橙色）</span>`:"")+
      `<span>生成 <b>${m.ms.toFixed(0)}</b> ms</span>`;
  }catch(e){ st.innerHTML=`<span class="err">${e.message}</span>`; $("qPaper").innerHTML=""; $("aPaper").innerHTML=""; maze=null; }
}
const schedule=()=>{clearTimeout(timer);timer=setTimeout(render,120);};
ids.forEach(id=>{$(id).addEventListener("input",schedule);});
$("reroll").addEventListener("click",()=>{$("seed").value=(parseInt($("seed").value)||0)+1;render();});

function loadImageFromBlob(blob){
  const url=URL.createObjectURL(blob); const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas"); const s=Math.min(1,1600/Math.max(img.width,img.height));
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    src=c; URL.revokeObjectURL(url); maze=null; render(); toast("画像を読み込みました");};
  img.onerror=()=>toast("この画像は読み込めませんでした");
  img.src=url;
}
$("file").addEventListener("change",e=>{const f=e.target.files[0]; if(f) loadImageFromBlob(f); e.target.value="";});
const stage=$("app");
stage.addEventListener("dragover",e=>{e.preventDefault();stage.classList.add("drop");});
stage.addEventListener("dragleave",e=>{if(e.target===stage)stage.classList.remove("drop");});
stage.addEventListener("drop",e=>{e.preventDefault();stage.classList.remove("drop");const f=[...e.dataTransfer.files].find(f=>f.type.startsWith("image/")); if(f) loadImageFromBlob(f);});
document.addEventListener("paste",e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/")); if(it){loadImageFromBlob(it.getAsFile());}});

function textToCanvas(t){
  const font='900 400px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Zen Kaku Gothic New",sans-serif';
  const m=document.createElement("canvas").getContext("2d"); m.font=font;
  const w=Math.ceil(m.measureText(t).width)+80, h=520;
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.fillStyle="#000"; x.font=font; x.textBaseline="middle"; x.fillText(t,40,h/2+10);
  // 余白を切り詰める
  const d=x.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){if(d[(y*w+xx)*4]<128){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<x0) return c;
  const o=document.createElement("canvas"); o.width=x1-x0+1; o.height=y1-y0+1;
  o.getContext("2d").drawImage(c,-x0,-y0); return o;
}
async function makeFromText(){
  const t=$("text").value.trim(); if(!t) return;
  try{ await Promise.race([document.fonts.load('900 400px "M PLUS Rounded 1c"',t),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  src=textToCanvas(t); maze=null; render();
}
$("textBtn").addEventListener("click",makeFromText);
$("text").addEventListener("keydown",e=>{if(e.key==="Enter")makeFromText();});

function toast(msg){const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),1800);}
document.querySelectorAll("button[data-act]").forEach(b=>b.addEventListener("click",async()=>{
  if(!maze) return; const svg=b.dataset.which==="q"?maze.qSVG:maze.aSVG; const name=b.dataset.which==="q"?"絵迷路_問題.svg":"絵迷路_解答.svg";
  if(b.dataset.act==="copy"){
    try{await navigator.clipboard.writeText(svg); toast("SVGをコピーしました");}
    catch(e){const ta=document.createElement("textarea"); ta.value=svg; document.body.appendChild(ta); ta.select();
      let ok=false; try{ok=document.execCommand("copy");}catch(_){} ta.remove(); toast(ok?"SVGをコピーしました":"コピーできませんでした");}
  }else if(dl){
    try{await dl.save({filename:name,data:svg}); toast("保存しました");}
    catch(e){ if(e&&e.code!=="declined") toast("保存できませんでした（"+(e.code||"error")+"）"); }
  }else{
    const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
}));
(async()=>{ try{ if(window.claude&&window.claude.use){ dl=await window.claude.use("downloads"); } }catch(e){dl=null;}
  document.querySelectorAll('button[data-act="save"]').forEach(b=>b.hidden=false); })();

render(); makeFromText();
</script>
