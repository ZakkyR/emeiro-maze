<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>絵迷路メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>絵迷路メーカー</h1>
    <p>正解ルートを塗ると絵が浮かぶ迷路を、画像や文字から作ります。</p>
  </header>

  <div class="layout">
    <aside class="panel" aria-label="設定">
      <div class="group">
        <h2>元にする絵</h2>
        <div class="row">
          <label class="btn">画像を選ぶ<input type="file" id="file" accept="image/*"></label>
          <span class="hint">ドロップ・貼り付けでもOK</span>
        </div>
        <div class="row">
          <input type="text" id="text" value="迷路" aria-label="文字">
          <button id="textBtn">文字で作る</button>
        </div>
        <canvas id="preview" aria-label="二値化した絵のプレビュー"></canvas>
        <p class="hint">黒が「塗られる部分」、青は離れた部分をつなぐために足した場所です。橙は一筆でつなげず塗らないことにした部分で、シードや入口・出口を変えると消えることがあります。</p>
      </div>

      <div class="group">
        <h2>絵の読み取り</h2>
        <div class="field"><div class="top"><label for="thr">しきい値</label><output id="thrOut"></output></div>
          <input type="range" id="thr" min="10" max="245" value="128"></div>
        <label class="check"><input type="checkbox" id="inv">白黒を反転する</label>
      </div>

      <div class="group">
        <h2>迷路の大きさ</h2>
        <div class="field"><div class="top"><label for="cols">横のマス数</label><output id="colsOut"></output></div>
          <input type="range" id="cols" min="24" max="240" step="2" value="64"></div>
        <div class="field"><div class="top"><label for="mTop">余白（上）</label><output id="mTopOut"></output></div>
          <input type="range" id="mTop" min="1" max="10" value="2"></div>
        <div class="field"><div class="top"><label for="mBottom">余白（下）</label><output id="mBottomOut"></output></div>
          <input type="range" id="mBottom" min="1" max="10" value="2"></div>
        <div class="field"><div class="top"><label for="mLeft">余白（左）</label><output id="mLeftOut"></output></div>
          <input type="range" id="mLeft" min="1" max="10" value="2"></div>
        <div class="field"><div class="top"><label for="mRight">余白（右）</label><output id="mRightOut"></output></div>
          <input type="range" id="mRight" min="1" max="10" value="2"></div>
        <label class="check"><input type="checkbox" id="mLink" checked>上下左右をそろえる</label>
      </div>

      <div class="group">
        <h2>迷路の性格</h2>
        <div class="field"><div class="top"><label for="branch">行き止まりの形</label><output id="branchOut"></output></div>
          <input type="range" id="branch" min="0" max="100" value="80"></div>
        <p class="hint">左ほど短い枝がたくさん、右ほど長く入り組みます。</p>
        <div class="row">
          <label for="start">入口</label>
          <select id="start"><option value="tl" selected>左上</option><option value="tr">右上</option><option value="bl">左下</option><option value="br">右下</option><option value="top">上（近い所）</option><option value="bottom">下（近い所）</option><option value="left">左（近い所）</option><option value="right">右（近い所）</option></select>
          <label for="goal">出口</label>
          <select id="goal"><option value="tl">左上</option><option value="tr">右上</option><option value="bl">左下</option><option value="br" selected>右下</option><option value="top">上（近い所）</option><option value="bottom">下（近い所）</option><option value="left">左（近い所）</option><option value="right">右（近い所）</option></select>
        </div>
        <div class="row">
          <label for="seed">シード</label>
          <input type="number" id="seed" value="1" min="0">
          <button id="reroll" class="primary">作り直す</button>
        </div>
      </div>

      <div class="group">
        <h2>SVG書き出し</h2>
        <div class="row">
          <label for="cellmm">1マス</label><input type="number" id="cellmm" value="3" min="0.5" step="0.1"><span class="hint">mm</span>
          <label for="linemm">線</label><input type="number" id="linemm" value="0.3" min="0.05" step="0.05"><span class="hint">mm</span>
        </div>
        <div class="row">
          <label for="fill">解答の塗り</label><input type="color" id="fill" value="#333333">
          <label class="check"><input type="checkbox" id="fadeAux" checked>つなぎ部分は薄く</label>
        </div>
        <label class="check"><input type="checkbox" id="routeLine">解答に経路の線も描く</label>
        <p class="hint" id="sizeHint"></p>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="status" id="status"></div>
      <div class="sheets">
        <section class="sheet">
          <div class="sheet-head">
            <h3>問題</h3>
            <div class="row">
              <button data-act="save" data-which="q">SVGを保存</button>
              <button data-act="copy" data-which="q">SVGをコピー</button>
            </div>
          </div>
          <div class="paper" id="qPaper"></div>
        </section>
        <section class="sheet">
          <div class="sheet-head">
            <h3>解答</h3>
            <div class="row">
              <button data-act="save" data-which="a">SVGを保存</button>
              <button data-act="copy" data-which="a">SVGをコピー</button>
            </div>
          </div>
          <div class="paper" id="aPaper"></div>
        </section>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/app.js"></script>

</body>
</html>
